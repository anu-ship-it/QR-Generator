<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>QR Code Generator</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    </head>
    <body>
        
        <input type="text" id="inputText" value="https://markodenic.tech" autofocus>
        <br><br>

        <select id="sizeSelect">
            <option value="150">Small (150px)</option>
            <option value="200" selected>Medium (200px)</option>
            <option value="300">Large (300px)</option>
            <option value="400">Extra Large (400px)</option>
        </select>
        <br><br>

        <canvas id="qrCanvas"></canvas>
        <br><br>

        <button id="downloadButton">Download as PNG</button>

        <script>
            const textInput = document.getElementById('inputText');
            const qrCanvas = document.getElementById('qrCanvas');
            const sizeSelect = document.getElementById('sizeSelect');
            const downloadButton = document.getElementById('downloadButton');

            function generatorQR() {
                const text = textInput.value.trim();
                if(!text) return;

                const size = parseInt(sizeSelect.value);

                qrCanvas.width = size;
                qrCanvas.height = size;

                new QRious({
                    element: qrCanvas,
                    value: text,
                    size: size,
                    background: '#ffffff',
                    foreground: '#000000'
                });

                downloadButton.style.display = 'block';
            }

            textInput.addEventListener('input', () => setTimeout(generatorQR, 300));
            sizeSelect.addEventListener('change', generatorQR);

            downloadButton.addEventListener('click', () => {
                const link = document.createElement('a');
                link.herf = qrCanvas.toDataURL('image/png');
                link.download = 'qrcode.png';
                link.click();
            });

            generatorQR();
        </script>
        
    </body>
</html>
